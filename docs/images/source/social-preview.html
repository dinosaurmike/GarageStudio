*{margin:0;box-sizing:border-box}
html,body{width:1280px;height:640px;overflow:hidden;font-family:Inter,system-ui,sans-serif;color:#0f172a;background:#f1f5f9}
body{background-image:linear-gradient(rgba(148,163,184,.25) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.25) 1px,transparent 1px);background-size:32px 32px}
